name: co2kernel_build
on:
  workflow_dispatch:
    inputs:
      KERNEL_NAME:
        description: "自定义 Linux version"
        required: true
        default: "-android13-8-o-01144-g8e1bc9d233a1"
      UTS_VERSION:
        description: "自定义 UTS_VERSION 时间戳"
        required: true
        default: "#1 SMP PREEMPT Thu Sep 4 03:07:39 UTC 2025"
      DMESG_BUFFER_2M:
        type: boolean
        description: "启用 2M dmesg 缓冲区"
        required: true
        default: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Configure Git
        run: |
          git config --global user.name "DogEZ"
          git config --global user.email "DdogezD@gmail.com"

      - name: Install dependencies
        run: |
          sudo apt update && sudo apt upgrade -y
          sudo apt install -y python3 git curl

      - name: Install repo tool
        run: |
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/repo
          chmod a+x ~/repo
          sudo mv ~/repo /usr/local/bin/repo

      - name: Initialize repo and sync
        run: |
          mkdir kernel_workspace && cd kernel_workspace
          repo init -u https://github.com/co2kernel/kernel_manifest.git -b refs/heads/oneplus/sm8550 -m oneplus_open_v.xml --depth=1
          repo sync

      - name: Add KernelSU Next + SUS_FS
        run: |
          cd kernel_workspace/kernel_platform
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -
          cd ./KernelSU-Next
          MAKE_FILE="kernel/Makefile"
          DEFAULT_VERSION=11998
          KSU_VERSION=$(($(git rev-list --count HEAD) + 10200))
          sed -i "s/^DKSU_VERSION.*/DKSU_VERSION=${KSU_VERSION}/" "${MAKE_FILE}"
          cd ../..
          git clone --depth 1 --branch co2kernel https://github.com/co2kernel/co2kernel_susfs.git
          cd kernel_platform
          cp ../co2kernel_susfs/kernel_patches/50_add_susfs_in_gki-android13-5.15.patch ./common/
          cp ../co2kernel_susfs/kernel_patches/fs/* ./common/fs/
          cp ../co2kernel_susfs/kernel_patches/include/linux/* ./common/include/linux/
          cd ./common
          patch -p1 < 50_add_susfs_in_gki-android13-5.15.patch || true
          cd ..
          cd ./KernelSU-Next
          cp ../../co2kernel_susfs/kernel_patches/next/10_enable_susfs_for_ksu.patch ./
          patch -p1 --forward < 10_enable_susfs_for_ksu.patch  || true
          for file in $(find ./kernel -maxdepth 2 -name "*.rej" -printf "%f\n" | cut -d'.' -f1); do
            echo "Patching file: $file.c with fix_$file.c.patch"
            patch -p1 --forward < "../../../co2kernel_susfs/kernel_patches/next/fix_$file.c.patch"
          done
          patch -p1 --forward < "../../../co2kernel_susfs/kernel_patches/next/fix_kernel_compat.c.patch"
          cd ..
          echo "CONFIG_KSU_SUSFS=y" >> "./common/arch/arm64/configs/gki_defconfig"
          echo "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y" >> "./common/arch/arm64/configs/gki_defconfig"
          echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> "./common/arch/arm64/configs/gki_defconfig"
          echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> "./common/arch/arm64/configs/gki_defconfig"
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y" >> "./common/arch/arm64/configs/gki_defconfig"
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y" >> "./common/arch/arm64/configs/gki_defconfig"
          echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> "./common/arch/arm64/configs/gki_defconfig"
          echo "CONFIG_KSU_SUSFS_SUS_OVERLAYFS=n" >> "./common/arch/arm64/configs/gki_defconfig"
          echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y" >> "./common/arch/arm64/configs/gki_defconfig"
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y" >> "./common/arch/arm64/configs/gki_defconfig"
          echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> "./common/arch/arm64/configs/gki_defconfig"
          echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y" >> "./common/arch/arm64/configs/gki_defconfig"
          echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y" >> "./common/arch/arm64/configs/gki_defconfig"
          echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y" >> "./common/arch/arm64/configs/gki_defconfig"
          echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y" >> "./common/arch/arm64/configs/gki_defconfig"
          echo "CONFIG_KSU_SUSFS_SUS_MAP=y" >> "./common/arch/arm64/configs/gki_defconfig"

      - name: Setup overwriter
        run: |
          cd kernel_workspace/kernel_platform/common
          chmod +x ./drivers/of/overwriter/overwrite_configs/convert_configs.sh
          ./drivers/of/overwriter/overwrite_configs/convert_configs.sh
          rm -rf ./drivers/of/overwriter/overwrite_configs
          rm -rf ./drivers/of/overwriter/tools
          rm -f ./drivers/of/overwriter/README.md
      
      - name: Add Debug flavors
        run: |
          cd kernel_workspace/kernel_platform/common
          if [ "${{ fromJSON(github.event.inputs.DMESG_BUFFER_2M) }}" = "true" ]; then
              echo "CONFIG_LOG_BUF_SHIFT=21" >> "./common/arch/arm64/configs/gki_defconfig"
          fi

      - name: Spoof Linux version
        run: |
          cd kernel_workspace/kernel_platform
          sed -i '$s|echo "\$res"|echo "\${{ github.event.inputs.KERNEL_NAME }}"|' ./common/scripts/setlocalversion
          sed -i '/UTS_VERSION=.*cut -b -\$UTS_LEN)/s#UTS_VERSION=.*#UTS_VERSION="\${{ github.event.inputs.UTS_VERSION }}"#' ./common/scripts/mkcompile_h

      - name: Build kernel
        run: |
          cd kernel_workspace
          LTO=thin ./kernel_platform/oplus/build/oplus_build_kernel.sh kalama gki

      - name: Make AnyKernel3
        run: |
         git clone https://github.com/co2kernel/AnyKernel3 --depth=1
         rm -rf ./AnyKernel3/.git
         cp kernel_workspace/kernel_platform/out/msm-kernel-kalama-gki/dist/Image ./AnyKernel3/

      - name: Upload AnyKernel3
        uses: actions/upload-artifact@v4
        with:
         name: co2kernel_ak3
         path: ./AnyKernel3/*

      - name: Upload kernel image
        uses: actions/upload-artifact@v4
        with:
         name: co2kernel
         path: kernel_workspace/kernel_platform/out/msm-kernel-kalama-gki/dist/Image
